backend:
  name: github
  repo: cepedasebastian-ship-it/residente
  branch: main
  base_url: https://residente-cms-auth.cepedasebastian.workers.dev
  auth_endpoint: auth

media_folder: "src/assets/uploads"
public_folder: "/uploads"

collections:
  - name: "trips"
    label: "Viajes"
    label_singular: "Viaje"
    folder: "src/content/trips"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Nombre corto para el menú (ej. Mendoza)", name: "navLabel", widget: "string" }
      - { label: "Etiqueta de ruta (ej. 33.9°S · Mendoza)", name: "coordLabel", widget: "string", required: false }
      - { label: "Badge (ej. Solo mujeres)", name: "badge", widget: "string", required: false }
      - label: "Estado"
        name: "status"
        widget: "select"
        required: false
        default: "proximo"
        options:
          - { label: "Próximo", value: "proximo" }
          - { label: "Cupo lleno", value: "cupo-lleno" }
          - { label: "Pasado", value: "pasado" }
      - { label: "Fecha (texto libre, ej. octubre 2026)", name: "dateLabel", widget: "string", required: false }
      - { label: "Duración (ej. 5 días · 4 noches)", name: "durationLabel", widget: "string", required: false }
      - { label: "Qué incluye (resumen corto)", name: "includesLabel", widget: "string", required: false }
      - { label: "Valor", name: "priceLabel", widget: "string", required: false }
      - { label: "Cupo (ej. cupo 10)", name: "capacityLabel", widget: "string", required: false }
      - label: "Incluye (lista de puntos)"
        name: "includes"
        widget: "list"
        required: false
        field: { label: "Punto", name: "item", widget: "string", required: false }
      - label: "Foto de portada"
        name: "coverImage"
        widget: "image"
        required: false
        media_folder: "/src/assets/uploads"
        public_folder: "../../assets/uploads"
      - { label: "Texto alternativo de la foto", name: "coverAlt", widget: "string", required: false }
      - { label: "Pie de foto (estilo polaroid)", name: "coverCaption", widget: "string", required: false }
      - label: "Más fotos (opcional)"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - label: "Foto"
            name: "photo"
            widget: "image"
            media_folder: "/src/assets/uploads"
            public_folder: "../../assets/uploads"
          - { label: "Pie de foto", name: "caption", widget: "string", required: false }
      - label: "Itinerario día por día (opcional)"
        name: "itinerary"
        widget: "list"
        required: false
        fields:
          - { label: "Día (ej. Día 1)", name: "day", widget: "string" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Orden (los más chicos aparecen primero)", name: "order", widget: "number", default: 1, required: false }
      - { label: "Descripción", name: "body", widget: "markdown", required: false }

  - name: "settings"
    label: "Textos generales"
    files:
      - file: "src/data/settings.json"
        label: "Configuración del sitio"
        name: "settings"
        fields:
          - { label: "Título grande del inicio", name: "heroTitle", widget: "string", required: false }
          - { label: "Subtítulo del inicio", name: "heroSubtitle", widget: "text", required: false }
          - { label: "Texto del botón principal", name: "heroCtaLabel", widget: "string", required: false }
          - { label: "Línea debajo de los botones (ej. próxima salida)", name: "heroMeta", widget: "string", required: false }
          - { label: "Frase de la entrada del cuaderno", name: "entryQuote", widget: "text", required: false }
          - { label: "Nombre de la fundadora (firma)", name: "founderName", widget: "string", required: false }
          - label: "Foto de la fundadora"
            name: "founderPhoto"
            widget: "image"
            required: false
            media_folder: "/public/uploads"
            public_folder: "/uploads"
          - { label: "Etiqueta de la sección de viajes", name: "viajesLabel", widget: "string", required: false }
          - { label: "Usuario de Instagram a mostrar (footer)", name: "footerHandle", widget: "string", required: false }
          - { label: "Link de Instagram", name: "instagramUrl", widget: "string", required: false }
          - { label: "Email donde recibir los formularios", name: "notifyEmail", widget: "string", required: false }
          - { label: "Número de WhatsApp (solo números, con código de país, sin +)", name: "whatsappNumber", widget: "string", required: false }
          - { label: "Teléfono a mostrar", name: "phoneLabel", widget: "string", required: false }
          - label: "Bio de Romi (un párrafo por línea)"
            name: "aboutBio"
            widget: "list"
            required: false
            field: { label: "Párrafo", name: "paragraph", widget: "text", required: false }
          - { label: "Para quién es esto (texto)", name: "paraQuienText", widget: "text", required: false }
          - label: "Para quién es esto (etiquetas cortas)"
            name: "paraQuienTags"
            widget: "list"
            required: false
            field: { label: "Etiqueta", name: "item", widget: "string", required: false }
          - { label: "Origen: etiqueta de ruta", name: "originCoordLabel", widget: "string", required: false }
          - { label: "Origen: texto", name: "originText", widget: "text", required: false }
          - { label: "Origen: precio de referencia", name: "originPrice", widget: "string", required: false }
          - label: "Principios de la marca"
            name: "principles"
            widget: "list"
            required: false
            fields:
              - { label: "Etiqueta", name: "tag", widget: "string", required: false }
              - { label: "Texto", name: "text", widget: "text", required: false }
          - label: "Preguntas frecuentes"
            name: "faq"
            widget: "list"
            required: false
            fields:
              - { label: "Pregunta", name: "q", widget: "string", required: false }
              - { label: "Respuesta", name: "a", widget: "text", required: false }

  - name: "submissions"
    label: "Registros de formularios"
    label_singular: "Registro"
    folder: "submissions"
    create: false
    delete: true
    format: "json"
    extension: "json"
    sortable_fields: ["date"]
    summary: "{{date}} — {{tipo}} — {{nombre}}"
    fields:
      - { label: "Fecha", name: "date", widget: "datetime", required: false }
      - { label: "Tipo", name: "tipo", widget: "string", required: false }
      - { label: "Viaje", name: "viaje", widget: "string", required: false }
      - { label: "Nombre", name: "nombre", widget: "string", required: false }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "Mensaje", name: "mensaje", widget: "text", required: false }
