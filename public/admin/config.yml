backend:
  name: github
  repo: cepedasebastian-ship-it/residente
  branch: main
  base_url: https://residente-cms-auth.cepedasebastian.workers.dev
  auth_endpoint: auth

media_folder: "src/assets/uploads"
public_folder: "/uploads"

collections:
  - name: "trips"
    label: "Viajes"
    label_singular: "Viaje"
    folder: "src/content/trips"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Nombre corto para el menú (ej. Mendoza)", name: "navLabel", widget: "string" }
      - { label: "Etiqueta de ruta (ej. 33.9°S · Mendoza)", name: "coordLabel", widget: "string" }
      - { label: "Badge (ej. Solo mujeres)", name: "badge", widget: "string" }
      - label: "Estado"
        name: "status"
        widget: "select"
        default: "proximo"
        options:
          - { label: "Próximo", value: "proximo" }
          - { label: "Cupo lleno", value: "cupo-lleno" }
          - { label: "Pasado", value: "pasado" }
      - { label: "Fecha (texto libre, ej. octubre 2026)", name: "dateLabel", widget: "string" }
      - { label: "Duración (ej. 5 días · 4 noches)", name: "durationLabel", widget: "string" }
      - { label: "Qué incluye (resumen corto)", name: "includesLabel", widget: "string" }
      - { label: "Valor", name: "priceLabel", widget: "string" }
      - { label: "Cupo (ej. cupo 10)", name: "capacityLabel", widget: "string" }
      - { label: "Cupos — total (opcional, dejar vacío para ocultar la barra de cupos)", name: "capacityTotal", widget: "number", required: false, value_type: "int" }
      - { label: "Cupos — ocupados (opcional, dejar vacío para ocultar la barra de cupos)", name: "spotsTaken", widget: "number", required: false, value_type: "int" }
      - label: "Incluye (lista de puntos)"
        name: "includes"
        widget: "list"
        field: { label: "Punto", name: "item", widget: "string" }
      - label: "Foto de portada"
        name: "coverImage"
        widget: "image"
        media_folder: "/src/assets/uploads"
        public_folder: "../../assets/uploads"
      - { label: "Texto alternativo de la foto", name: "coverAlt", widget: "string" }
      - { label: "Pie de foto (estilo polaroid)", name: "coverCaption", widget: "string" }
      - label: "Más fotos (opcional)"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - label: "Foto"
            name: "photo"
            widget: "image"
            media_folder: "/src/assets/uploads"
            public_folder: "../../assets/uploads"
          - { label: "Pie de foto", name: "caption", widget: "string", required: false }
      - label: "Itinerario día por día (opcional)"
        name: "itinerary"
        widget: "list"
        required: false
        fields:
          - { label: "Día (ej. Día 1)", name: "day", widget: "string" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Orden (los más chicos aparecen primero)", name: "order", widget: "number", default: 0, required: false }
      - { label: "Descripción", name: "body", widget: "markdown", required: false }

  - name: "settings"
    label: "Textos generales"
    files:
      - file: "src/data/settings.json"
        label: "Configuración del sitio"
        name: "settings"
        fields:
          - { label: "Título grande del inicio", name: "heroTitle", widget: "string", required: false }
          - { label: "Subtítulo del inicio", name: "heroSubtitle", widget: "text", required: false }
          - { label: "Texto del botón principal", name: "heroCtaLabel", widget: "string", required: false }
          - { label: "Línea debajo de los botones (ej. próxima salida)", name: "heroMeta", widget: "string", required: false }
          - { label: "Frase de la entrada del cuaderno", name: "entryQuote", widget: "text", required: false }
          - { label: "Nombre de la fundadora (firma)", name: "founderName", widget: "string", required: false }
          - label: "Foto de la fundadora"
            name: "founderPhoto"
            widget: "image"
            required: false
            media_folder: "/public/uploads"
            public_folder: "/uploads"
          - { label: "Etiqueta de la sección de viajes", name: "viajesLabel", widget: "string", required: false }
          - { widget: "hr", name: "divider-nav" }
          - { label: "Menú — texto del link a Sobre Romi", name: "navAboutLabel", widget: "string", required: false }
          - { label: "Menú — texto del link al Cuaderno", name: "navJournalLabel", widget: "string", required: false }
          - { label: "Menú — texto del link a FAQ", name: "navFaqLabel", widget: "string", required: false }
          - { label: "Menú — texto del link a Contacto", name: "navContactLabel", widget: "string", required: false }
          - { label: "Usuario de Instagram a mostrar (footer)", name: "footerHandle", widget: "string", required: false }
          - { label: "Link de Instagram", name: "instagramUrl", widget: "string", required: false }
          - { label: "Email donde recibir los formularios", name: "notifyEmail", widget: "string", required: false }
          - { label: "Número de WhatsApp (solo números, con código de país, sin +)", name: "whatsappNumber", widget: "string", required: false }
          - { label: "Teléfono a mostrar", name: "phoneLabel", widget: "string", required: false }
          - { widget: "hr", name: "divider-entry" }
          - { label: "Entrada — etiqueta pequeña arriba de la frase", name: "entryLabel", widget: "string", required: false }
          - label: "Bio de Romi (un párrafo por línea)"
            name: "aboutBio"
            widget: "list"
            required: false
            field: { label: "Párrafo", name: "paragraph", widget: "text", required: false }
          - { widget: "hr", name: "divider-para-quien" }
          - { label: "Para quién es esto (título)", name: "paraQuienLabel", widget: "string", required: false }
          - { label: "Para quién es esto (texto)", name: "paraQuienText", widget: "text", required: false }
          - label: "Para quién es esto (etiquetas cortas)"
            name: "paraQuienTags"
            widget: "list"
            required: false
            field: { label: "Etiqueta", name: "item", widget: "string", required: false }
          - { widget: "hr", name: "divider-about" }
          - { label: "Sobre Romi (título)", name: "aboutLabel", widget: "string", required: false }
          - { label: "Sobre Romi (etiqueta chica)", name: "aboutSubLabel", widget: "string", required: false }
          - { widget: "hr", name: "divider-origin" }
          - { label: "Origen: etiqueta de ruta", name: "originCoordLabel", widget: "string", required: false }
          - { label: "Origen: texto", name: "originText", widget: "text", required: false }
          - { label: "Origen: precio de referencia", name: "originPrice", widget: "string", required: false }
          - { widget: "hr", name: "divider-principles" }
          - { label: "La idea, en tres partes (título)", name: "principlesLabel", widget: "string", required: false }
          - label: "Principios de la marca"
            name: "principles"
            widget: "list"
            required: false
            fields:
              - { label: "Etiqueta", name: "tag", widget: "string", required: false }
              - { label: "Texto", name: "text", widget: "text", required: false }
          - { widget: "hr", name: "divider-faq" }
          - { label: "FAQ — etiqueta chica", name: "faqLabel", widget: "string", required: false }
          - { label: "FAQ — título", name: "faqTitle", widget: "string", required: false }
          - { label: "FAQ — nota de advertencia (dejar vacío para ocultarla)", name: "faqNote", widget: "string", required: false }
          - label: "Preguntas frecuentes"
            name: "faq"
            widget: "list"
            required: false
            fields:
              - { label: "Pregunta", name: "q", widget: "string", required: false }
              - { label: "Respuesta", name: "a", widget: "text", required: false }
          - { widget: "hr", name: "divider-contact" }
          - { label: "Contacto — título", name: "contactLabel", widget: "string", required: false }
          - { label: "Contacto — texto", name: "contactText", widget: "text", required: false }
          - { label: "Contacto — etiqueta \"Directo\"", name: "contactDirectLabel", widget: "string", required: false }
          - { label: "Contacto — placeholder nombre", name: "contactNamePlaceholder", widget: "string", required: false }
          - { label: "Contacto — placeholder email", name: "contactEmailPlaceholder", widget: "string", required: false }
          - { label: "Contacto — placeholder mensaje", name: "contactMessagePlaceholder", widget: "string", required: false }
          - { label: "Contacto — texto del botón enviar", name: "contactSubmitLabel", widget: "string", required: false }
          - { widget: "hr", name: "divider-trips" }
          - { label: "Tarjeta de viaje — texto \"ver viaje completo\"", name: "viewTripLabel", widget: "string", required: false }
          - { label: "Página de viaje — texto \"volver a todos los viajes\"", name: "backToTripsLabel", widget: "string", required: false }
          - { label: "Página de viaje — etiqueta \"día por día\"", name: "itineraryLabel", widget: "string", required: false }
          - { label: "Página de viaje — título \"también puede interesarte\"", name: "relatedTripsLabel", widget: "string", required: false }
          - { label: "Lista de espera — título", name: "waitlistTitle", widget: "string", required: false }
          - { label: "Lista de espera — texto", name: "waitlistText", widget: "text", required: false }
          - { label: "Lista de espera — texto del botón", name: "waitlistButtonLabel", widget: "string", required: false }
          - { label: "Lista de espera — nota de precio a confirmar", name: "waitlistPriceNote", widget: "string", required: false }
          - { widget: "hr", name: "divider-newsletter" }
          - { label: "Newsletter — etiqueta chica", name: "newsletterLabel", widget: "string", required: false }
          - { label: "Newsletter — título", name: "newsletterTitle", widget: "string", required: false }
          - { label: "Newsletter — texto", name: "newsletterText", widget: "text", required: false }
          - { label: "Newsletter — texto del botón", name: "newsletterButtonLabel", widget: "string", required: false }
          - { widget: "hr", name: "divider-journal" }
          - { label: "Cuaderno — etiqueta chica", name: "journalLabel", widget: "string", required: false }
          - { label: "Cuaderno — título", name: "journalTitle", widget: "string", required: false }
          - { label: "Cuaderno — texto \"ver todas las notas\"", name: "journalMoreLabel", widget: "string", required: false }
          - { label: "Cuaderno — título \"otras notas\" dentro de cada nota", name: "journalRelatedLabel", widget: "string", required: false }

  - name: "posts"
    label: "Cuaderno de viaje"
    label_singular: "Nota"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["date"]
    summary: "{{date}} — {{title}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Resumen corto (se muestra en las tarjetas)", name: "excerpt", widget: "text" }
      - label: "Foto de portada"
        name: "coverImage"
        widget: "image"
        media_folder: "/src/assets/uploads"
        public_folder: "../../assets/uploads"
      - { label: "Texto alternativo de la foto", name: "coverAlt", widget: "string" }
      - { label: "Texto de la nota", name: "body", widget: "markdown" }

  - name: "submissions"
    label: "Registros de formularios"
    label_singular: "Registro"
    folder: "submissions"
    create: false
    delete: true
    format: "json"
    extension: "json"
    sortable_fields: ["date", "tipo", "nombre"]
    summary: "{{date}} — {{tipo}} — {{nombre}} — {{email}} — {{viaje}}"
    fields:
      - { label: "Fecha", name: "date", widget: "datetime", required: false }
      - { label: "Tipo", name: "tipo", widget: "string", required: false }
      - { label: "Viaje", name: "viaje", widget: "string", required: false }
      - { label: "Nombre", name: "nombre", widget: "string", required: false }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "Mensaje", name: "mensaje", widget: "text", required: false }
      - { label: "Notas internas", name: "notas", widget: "text", required: false, hint: "Solo para uso interno — no se muestra en el sitio." }
