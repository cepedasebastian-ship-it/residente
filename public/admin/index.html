<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Contenido — Experiencia Residente</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      var TripPreview = createClass({
        render: function () {
          var self = this;
          var entry = this.props.entry;
          var data = entry.get('data');
          var image = data.get('coverImage');
          var imageUrl = image ? this.props.getAsset(image).toString() : null;
          var includes = data.get('includes');
          var gallery = data.get('gallery');
          var itinerary = data.get('itinerary');
          var capacityTotal = data.get('capacityTotal');
          var spotsTaken = data.get('spotsTaken');
          var showSpots = typeof capacityTotal === 'number' && capacityTotal > 0 && typeof spotsTaken === 'number';
          var spotsPct = showSpots ? Math.min(100, Math.round((spotsTaken / capacityTotal) * 100)) : 0;

          return h(
            'div',
            { className: 'preview-wrap' },
            h(
              'div',
              {},
              h('div', { className: 'f-tape-strip' }),
              h(
                'div',
                { className: 'f-polaroid' },
                h(
                  'div',
                  { className: 'f-polaroid-inner' },
                  imageUrl ? h('img', { src: imageUrl, alt: data.get('coverAlt') || '' }) : null
                ),
                h('div', { className: 'f-polaroid-cap' }, data.get('coverCaption') || 'sin foto todavía')
              )
            ),
            gallery && gallery.size
              ? h(
                  'div',
                  { className: 'f-gallery-row' },
                  gallery.map(function (item, i) {
                    var photo = item.get('photo');
                    var photoUrl = photo ? self.props.getAsset(photo).toString() : null;
                    var caption = item.get('caption');
                    return h(
                      'div',
                      { className: 'f-polaroid f-polaroid-sm ' + (i % 2 === 0 ? 'f-rotate-left' : 'f-rotate-right'), key: i },
                      h(
                        'div',
                        { className: 'f-polaroid-inner' },
                        photoUrl ? h('img', { src: photoUrl, alt: caption || '' }) : null
                      ),
                      caption ? h('div', { className: 'f-polaroid-cap' }, caption) : null
                    );
                  }).toArray()
                )
              : null,
            h(
              'div',
              { className: 'f-card' },
              h(
                'div',
                { className: 'f-card-top' },
                h('span', { className: 'f-stamp-badge' }, data.get('badge') || 'sin badge'),
                h(
                  'span',
                  { className: 'f-date-tag' },
                  data.get('durationLabel') || '(duración)',
                  h('br'),
                  data.get('dateLabel') || '(fecha)',
                  h('br'),
                  data.get('capacityLabel') || '(cupo)'
                )
              ),
              showSpots
                ? h(
                    'div',
                    { className: 'f-spots-row' },
                    h('span', { className: 'f-spots-bar' }, h('span', { style: { width: spotsPct + '%' } })),
                    h('span', { className: 'f-spots-label' }, spotsTaken + ' de ' + capacityTotal + ' lugares ocupados')
                  )
                : null,
              h('h2', {}, data.get('title') || 'Sin título todavía'),
              h('div', { className: 'f-desc' }, this.props.widgetFor('body')),
              h(
                'div',
                { className: 'f-price-row' },
                h(
                  'div',
                  { className: 'f-price-item' },
                  h('span', { className: 'f-price-label' }, 'Duración'),
                  h('span', { className: 'f-price-value' }, data.get('durationLabel') || '—')
                ),
                h(
                  'div',
                  { className: 'f-price-item' },
                  h('span', { className: 'f-price-label' }, 'Incluye'),
                  h('span', { className: 'f-price-value' }, data.get('includesLabel') || '—')
                ),
                h(
                  'div',
                  { className: 'f-price-item' },
                  h('span', { className: 'f-price-label' }, 'Valor'),
                  h('span', { className: 'f-price-value' }, data.get('priceLabel') || '—')
                )
              ),
              includes && includes.size
                ? h(
                    'ul',
                    { className: 'f-list' },
                    includes.map(function (item, i) {
                      return h('li', { key: i }, item);
                    }).toArray()
                  )
                : null
            ),
            itinerary && itinerary.size
              ? h(
                  'div',
                  { className: 'f-itinerary' },
                  h('span', { className: 'f-entry-label', style: { display: 'block', marginBottom: '16px' } }, 'Día por día'),
                  itinerary.map(function (stop, i) {
                    return h(
                      'div',
                      { className: 'f-itinerary-stop', key: i },
                      h('span', { className: 'f-itinerary-day' }, stop.get('day') || '(día)'),
                      h('h3', {}, stop.get('title') || '(título)'),
                      h('p', {}, stop.get('description') || '(descripción)')
                    );
                  }).toArray()
                )
              : null,
            h(
              'p',
              { className: 'preview-note' },
              'PREVIEW — así se va a ver esta tarjeta en la home. Los campos vacíos se muestran entre paréntesis, no van a aparecer así en el sitio real. El itinerario, si lo cargás, aparece en la página propia del viaje.'
            )
          );
        },
      });

      var SettingsPreview = createClass({
        render: function () {
          var data = this.props.entry.get('data');
          var aboutBio = data.get('aboutBio');
          var paraQuienTags = data.get('paraQuienTags');
          var principles = data.get('principles');
          var faq = data.get('faq');
          var founderPhoto = data.get('founderPhoto');
          var founderPhotoUrl = founderPhoto ? this.props.getAsset(founderPhoto).toString() : null;

          return h(
            'div',
            { className: 'preview-wrap' },
            h(
              'header',
              { className: 'f-hero' },
              h('h1', {}, data.get('heroTitle') || '(título del inicio)'),
              h('p', {}, data.get('heroSubtitle') || '(subtítulo del inicio)'),
              h(
                'div',
                { className: 'f-hero-ctas' },
                h('span', { className: 'f-btn' }, data.get('heroCtaLabel') || '(texto del botón)')
              ),
              h('div', { className: 'f-meta' }, data.get('heroMeta') || '(línea debajo de los botones)')
            ),
            h(
              'div',
              { className: 'f-entry' },
              h('span', { className: 'f-entry-label' }, data.get('entryLabel') || '(etiqueta de la entrada)'),
              h('blockquote', {}, '"' + (data.get('entryQuote') || '(frase de la entrada)') + '"'),
              h('div', { className: 'f-sig' }, data.get('founderName') || '(firma)')
            ),
            h(
              'div',
              { className: 'f-para-quien' },
              h('span', { className: 'f-entry-label' }, data.get('paraQuienLabel') || '(título de para quién es esto)'),
              h('p', {}, data.get('paraQuienText') || '(sin texto todavía)'),
              paraQuienTags && paraQuienTags.size
                ? h(
                    'div',
                    { className: 'f-tags' },
                    paraQuienTags.map(function (tag, i) {
                      return h('span', { className: 'f-tag-pill', key: i }, tag);
                    }).toArray()
                  )
                : null
            ),
            h(
              'div',
              { className: 'f-about' },
              h(
                'div',
                { className: 'f-about-head' },
                h('h2', {}, data.get('aboutLabel') || 'Sobre Romi'),
                h('span', { className: 'f-entry-label', style: { marginBottom: 0 } }, data.get('aboutSubLabel') || '(etiqueta chica)')
              ),
              founderPhotoUrl
                ? h(
                    'div',
                    { className: 'f-polaroid f-about-photo' },
                    h('div', { className: 'f-polaroid-inner' }, h('img', { src: founderPhotoUrl, alt: data.get('founderName') || '' }))
                  )
                : null,
              aboutBio && aboutBio.size
                ? aboutBio.map(function (p, i) {
                    return h('p', { key: i }, p);
                  }).toArray()
                : h('p', {}, '(sin bio todavía)'),
              h('span', { className: 'f-sig' }, 'Romi')
            ),
            h(
              'div',
              { className: 'f-origin' },
              h('span', { className: 'f-entry-label' }, data.get('originCoordLabel') || '(etiqueta de origen)'),
              h('p', { style: { marginTop: '12px' } }, data.get('originText') || '(sin texto todavía)'),
              h('span', { className: 'f-origin-price' }, data.get('originPrice') || '')
            ),
            h(
              'div',
              {},
              h('span', { className: 'f-entry-label' }, data.get('principlesLabel') || '(título de la idea en tres partes)'),
              h(
                'div',
                { className: 'f-principles' },
                principles && principles.size
                  ? principles.map(function (p, i) {
                      return h(
                        'div',
                        { className: 'f-principle', key: i },
                        h('span', { className: 'tag' }, p.get('tag')),
                        h('p', {}, p.get('text'))
                      );
                    }).toArray()
                  : null
              )
            ),
            h(
              'div',
              { className: 'f-faq' },
              h('span', { className: 'f-entry-label' }, data.get('faqLabel') || 'Preguntas frecuentes'),
              h('h2', { style: { marginBottom: '10px' } }, data.get('faqTitle') || '(título de la sección FAQ)'),
              faq && faq.size
                ? faq.map(function (item, i) {
                    return h(
                      'div',
                      { className: 'f-faq-item', key: i },
                      h('p', { className: 'f-faq-q' }, item.get('q')),
                      h('p', { className: 'f-faq-a' }, item.get('a'))
                    );
                  }).toArray()
                : null,
              data.get('faqNote') ? h('p', { className: 'preview-note' }, data.get('faqNote')) : null
            ),
            h('hr', { className: 'f-section-divider' }),
            h(
              'div',
              { className: 'f-contact-direct' },
              h('h2', {}, data.get('contactLabel') || 'Hablemos'),
              h('p', {}, data.get('contactText') || '(texto de contacto)'),
              h('span', { className: 'f-entry-label' }, data.get('contactDirectLabel') || 'Directo'),
              h('span', { className: 'f-phone' }, data.get('phoneLabel') || '(sin teléfono)'),
              h(
                'p',
                { className: 'preview-note' },
                'WhatsApp: ' + (data.get('whatsappNumber') || '(sin número)') + ' — Email de notificaciones: ' + (data.get('notifyEmail') || '(sin email)')
              )
            ),
            h('hr', { className: 'f-section-divider' }),
            h(
              'div',
              {},
              h('span', { className: 'f-entry-label' }, data.get('journalLabel') || '(etiqueta chica del cuaderno)'),
              h('h2', { style: { marginBottom: '6px' } }, data.get('journalTitle') || '(título del cuaderno)'),
              h('p', { className: 'preview-note' }, 'Texto del link "ver todas": ' + (data.get('journalMoreLabel') || '(sin texto)')),
              h(
                'p',
                { className: 'preview-note' },
                'Texto del link entre viajes ("también puede interesarte"): ' + (data.get('relatedTripsLabel') || '(sin texto)')
              ),
              h(
                'p',
                { className: 'preview-note' },
                'Título "otras notas" dentro de cada nota: ' + (data.get('journalRelatedLabel') || '(sin texto)')
              )
            ),
            h(
              'p',
              { className: 'preview-note' },
              'PREVIEW — así se ven estos textos repartidos por la página. No es una sola sección del sitio, es un resumen de todas juntas.'
            )
          );
        },
      });

      var PostPreview = createClass({
        render: function () {
          var data = this.props.entry.get('data');
          var image = data.get('coverImage');
          var imageUrl = image ? this.props.getAsset(image).toString() : null;

          return h(
            'div',
            { className: 'preview-wrap' },
            h(
              'header',
              { className: 'f-page-hero' },
              h('span', { className: 'f-entry-label' }, data.get('date') ? String(data.get('date')).slice(0, 10) : '(sin fecha)'),
              h('h1', {}, data.get('title') || 'Sin título todavía')
            ),
            h(
              'div',
              { className: 'f-polaroid', style: { width: '320px' } },
              h('div', { className: 'f-polaroid-inner' }, imageUrl ? h('img', { src: imageUrl, alt: data.get('coverAlt') || '' }) : null)
            ),
            h('p', { className: 'f-desc' }, data.get('excerpt') || '(sin resumen todavía)'),
            h('div', { className: 'f-desc' }, this.props.widgetFor('body')),
            h(
              'p',
              { className: 'preview-note' },
              'PREVIEW — así se ve esta nota en /cuaderno. El resumen también aparece en la tarjeta de la home y del listado.'
            )
          );
        },
      });

      CMS.registerPreviewStyle('/admin/preview.css');
      CMS.registerPreviewTemplate('trips', TripPreview);
      CMS.registerPreviewTemplate('settings', SettingsPreview);
      CMS.registerPreviewTemplate('posts', PostPreview);
    </script>
  </body>
</html>
