<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Contenido — Experiencia Residente</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      var TripPreview = createClass({
        render: function () {
          var self = this;
          var entry = this.props.entry;
          var data = entry.get('data');
          var image = data.get('coverImage');
          var imageUrl = image ? this.props.getAsset(image).toString() : null;
          var includes = data.get('includes');
          var gallery = data.get('gallery');
          var itinerary = data.get('itinerary');

          return h(
            'div',
            { className: 'preview-wrap' },
            h(
              'div',
              {},
              h('div', { className: 'f-tape-strip' }),
              h(
                'div',
                { className: 'f-polaroid' },
                h(
                  'div',
                  { className: 'f-polaroid-inner' },
                  imageUrl ? h('img', { src: imageUrl, alt: data.get('coverAlt') || '' }) : null
                ),
                h('div', { className: 'f-polaroid-cap' }, data.get('coverCaption') || 'sin foto todavía')
              )
            ),
            gallery && gallery.size
              ? h(
                  'div',
                  { className: 'f-gallery-row' },
                  gallery.map(function (item, i) {
                    var photo = item.get('photo');
                    var photoUrl = photo ? self.props.getAsset(photo).toString() : null;
                    var caption = item.get('caption');
                    return h(
                      'div',
                      { className: 'f-polaroid f-polaroid-sm ' + (i % 2 === 0 ? 'f-rotate-left' : 'f-rotate-right'), key: i },
                      h(
                        'div',
                        { className: 'f-polaroid-inner' },
                        photoUrl ? h('img', { src: photoUrl, alt: caption || '' }) : null
                      ),
                      caption ? h('div', { className: 'f-polaroid-cap' }, caption) : null
                    );
                  }).toArray()
                )
              : null,
            h(
              'div',
              { className: 'f-card' },
              h(
                'div',
                { className: 'f-card-top' },
                h('span', { className: 'f-stamp-badge' }, data.get('badge') || 'sin badge'),
                h(
                  'span',
                  { className: 'f-date-tag' },
                  data.get('durationLabel') || '(duración)',
                  h('br'),
                  data.get('dateLabel') || '(fecha)',
                  h('br'),
                  data.get('capacityLabel') || '(cupo)'
                )
              ),
              h('h2', {}, data.get('title') || 'Sin título todavía'),
              h('div', { className: 'f-desc' }, this.props.widgetFor('body')),
              h(
                'div',
                { className: 'f-price-row' },
                h(
                  'div',
                  { className: 'f-price-item' },
                  h('span', { className: 'f-price-label' }, 'Duración'),
                  h('span', { className: 'f-price-value' }, data.get('durationLabel') || '—')
                ),
                h(
                  'div',
                  { className: 'f-price-item' },
                  h('span', { className: 'f-price-label' }, 'Incluye'),
                  h('span', { className: 'f-price-value' }, data.get('includesLabel') || '—')
                ),
                h(
                  'div',
                  { className: 'f-price-item' },
                  h('span', { className: 'f-price-label' }, 'Valor'),
                  h('span', { className: 'f-price-value' }, data.get('priceLabel') || '—')
                )
              ),
              includes && includes.size
                ? h(
                    'ul',
                    { className: 'f-list' },
                    includes.map(function (item, i) {
                      return h('li', { key: i }, item);
                    }).toArray()
                  )
                : null
            ),
            itinerary && itinerary.size
              ? h(
                  'div',
                  { className: 'f-itinerary' },
                  h('span', { className: 'f-entry-label', style: { display: 'block', marginBottom: '16px' } }, 'Día por día'),
                  itinerary.map(function (stop, i) {
                    return h(
                      'div',
                      { className: 'f-itinerary-stop', key: i },
                      h('span', { className: 'f-itinerary-day' }, stop.get('day') || '(día)'),
                      h('h3', {}, stop.get('title') || '(título)'),
                      h('p', {}, stop.get('description') || '(descripción)')
                    );
                  }).toArray()
                )
              : null,
            h(
              'p',
              { className: 'preview-note' },
              'PREVIEW — así se va a ver esta tarjeta en la home. Los campos vacíos se muestran entre paréntesis, no van a aparecer así en el sitio real. El itinerario, si lo cargás, aparece en la página propia del viaje.'
            )
          );
        },
      });

      var SettingsPreview = createClass({
        render: function () {
          var data = this.props.entry.get('data');
          var aboutBio = data.get('aboutBio');
          var paraQuienTags = data.get('paraQuienTags');
          var principles = data.get('principles');
          var faq = data.get('faq');

          return h(
            'div',
            { className: 'preview-wrap' },
            h(
              'div',
              { className: 'f-para-quien' },
              h('span', { className: 'f-entry-label' }, '¿Para quién es esto?'),
              h('p', {}, data.get('paraQuienText') || '(sin texto todavía)'),
              paraQuienTags && paraQuienTags.size
                ? h(
                    'div',
                    { className: 'f-tags' },
                    paraQuienTags.map(function (tag, i) {
                      return h('span', { className: 'f-tag-pill', key: i }, tag);
                    }).toArray()
                  )
                : null
            ),
            h(
              'div',
              { className: 'f-about' },
              h(
                'div',
                { className: 'f-about-head' },
                h('h2', {}, 'Sobre Romi'),
                h('span', { className: 'f-entry-label', style: { marginBottom: 0 } }, 'La entrada más larga del cuaderno')
              ),
              aboutBio && aboutBio.size
                ? aboutBio.map(function (p, i) {
                    return h('p', { key: i }, p);
                  }).toArray()
                : h('p', {}, '(sin bio todavía)'),
              h('span', { className: 'f-sig' }, 'Romi')
            ),
            h(
              'div',
              { className: 'f-origin' },
              h('span', { className: 'f-entry-label' }, data.get('originCoordLabel') || '(etiqueta de origen)'),
              h('p', { style: { marginTop: '12px' } }, data.get('originText') || '(sin texto todavía)'),
              h('span', { className: 'f-origin-price' }, data.get('originPrice') || '')
            ),
            h(
              'div',
              {},
              h('span', { className: 'f-entry-label' }, 'La idea, en tres partes'),
              h(
                'div',
                { className: 'f-principles' },
                principles && principles.size
                  ? principles.map(function (p, i) {
                      return h(
                        'div',
                        { className: 'f-principle', key: i },
                        h('span', { className: 'tag' }, p.get('tag')),
                        h('p', {}, p.get('text'))
                      );
                    }).toArray()
                  : null
              )
            ),
            h(
              'div',
              { className: 'f-faq' },
              h('span', { className: 'f-entry-label' }, 'Preguntas frecuentes'),
              faq && faq.size
                ? faq.map(function (item, i) {
                    return h(
                      'div',
                      { className: 'f-faq-item', key: i },
                      h('p', { className: 'f-faq-q' }, item.get('q')),
                      h('p', { className: 'f-faq-a' }, item.get('a'))
                    );
                  }).toArray()
                : null
            ),
            h('hr', { className: 'f-section-divider' }),
            h(
              'div',
              { className: 'f-contact-direct' },
              h('span', { className: 'f-entry-label' }, 'Directo'),
              h('span', { className: 'f-phone' }, data.get('phoneLabel') || '(sin teléfono)'),
              h(
                'p',
                { className: 'preview-note' },
                'WhatsApp: ' + (data.get('whatsappNumber') || '(sin número)') + ' — Email de notificaciones: ' + (data.get('notifyEmail') || '(sin email)')
              )
            ),
            h(
              'p',
              { className: 'preview-note' },
              'PREVIEW — así se ven estos textos repartidos por la página. No es una sola sección del sitio, es un resumen de todas juntas.'
            )
          );
        },
      });

      CMS.registerPreviewStyle('/admin/preview.css');
      CMS.registerPreviewTemplate('trips', TripPreview);
      CMS.registerPreviewTemplate('settings', SettingsPreview);
    </script>
  </body>
</html>
