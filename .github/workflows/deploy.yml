name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=experiencia-residente --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify search engines (IndexNow) of every page in the sitemap
        run: |
          python3 - <<'EOF'
          import glob, json, re, urllib.request

          urls = []
          for path in glob.glob('dist/sitemap-*.xml'):
              content = open(path, encoding='utf-8').read()
              urls += re.findall(r'<loc>(.*?)</loc>', content)
          urls = [u for u in urls if not u.endswith('.xml')]

          if not urls:
              print('No URLs found in sitemap, skipping IndexNow ping.')
          else:
              payload = json.dumps({
                  'host': 'experiencia-residente.pages.dev',
                  'key': 'd52996abfe88c4ea67e7e1f3a73a590a',
                  'keyLocation': 'https://experiencia-residente.pages.dev/d52996abfe88c4ea67e7e1f3a73a590a.txt',
                  'urlList': urls,
              }).encode('utf-8')
              req = urllib.request.Request(
                  'https://api.indexnow.org/indexnow',
                  data=payload,
                  headers={'Content-Type': 'application/json; charset=utf-8'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      print('IndexNow response:', resp.status, '-', len(urls), 'URLs submitted')
              except Exception as e:
                  print('IndexNow ping failed (non-fatal):', e)
          EOF
